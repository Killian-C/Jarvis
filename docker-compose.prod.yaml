# docker-compose.prod.yaml
# Configuration PRODUCTION sécurisée

version: '3.8'

services:
  symfony:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - DATABASE_URL=${DATABASE_URL}
      - APP_SECRET=${APP_SECRET}
    depends_on:
      - my_database
    networks:
      - symfony_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/symfony/public:ro
      - ./configuration/nginx/conf.d/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - symfony
    networks:
      - symfony_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  my_database:
    container_name: my_database_prod
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=jarvis
      - MYSQL_USER=jarvis_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    # NE PAS exposer le port en production (commenté)
    # ports:
    #   - "3307:3306"
    networks:
      - symfony_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  symfony_network:
    driver: bridge

volumes:
  db_data:
    driver: local
